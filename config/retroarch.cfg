# Pokepi RetroArch settings. Only the lines that differ from the defaults.
# Installed to ~/.config/retroarch/retroarch.cfg by setup/install-retroarch-config.sh

# Screen. The SPI panel is DRM card0 at 320x240.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_fullscreen_x = "320"
video_fullscreen_y = "240"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "21"
video_shader_enable = "false"
video_font_enable = "true"
video_font_size = "12.000000"

# Menu. RGUI is the lightest and is drawn at the panel's own resolution.
menu_driver = "rgui"
rgui_aspect_ratio = "1"
rgui_aspect_ratio_lock = "1"
menu_show_load_content_animation = "false"
menu_enable_widgets = "false"
pause_nonactive = "false"

# Input. The pad shows up as "Pokepi Pad" through uinput.
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "0"
input_menu_toggle_btn = "8"
input_toggle_fast_forward_btn = "9"

# No speaker yet
audio_enable = "false"
audio_driver = "null"

# Files
rgui_browser_directory = "~/roms"
savefile_directory = "~/saves"
savestate_directory = "~/states"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
savestate_auto_save = "true"
savestate_auto_load = "true"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro/"
libretro_info_path = "/usr/share/libretro/info/"

# Saves CPU on the Zero 2 W
core_info_cache_enable = "false"
fps_show = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
