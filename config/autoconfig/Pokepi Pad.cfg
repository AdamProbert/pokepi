# RetroArch udev autoconfig for the Pokepi Pad (pokepi/pad_gamepad.py).
# udev numbers buttons in key code order, so with the keys the service exposes:
# 0 SOUTH(B) 1 EAST(A) 2 NORTH(X) 3 WEST(Y) 4 TL 5 TR 6 SELECT 7 START 8 MODE 9 THUMBL
# 10 DPAD_UP 11 DPAD_DOWN 12 DPAD_LEFT 13 DPAD_RIGHT
input_driver = "udev"
input_device = "Pokepi Pad"
input_vendor_id = "4617"
input_product_id = "28752"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "6"
input_start_btn = "7"
input_menu_toggle_btn = "8"
input_up_btn = "10"
input_down_btn = "11"
input_left_btn = "12"
input_right_btn = "13"

input_b_btn_label = "B"
input_a_btn_label = "A"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_l_btn_label = "HAT A"
input_r_btn_label = "HAT X"
input_select_btn_label = "Minus"
input_start_btn_label = "Plus"
input_menu_toggle_btn_label = "HAT B"
