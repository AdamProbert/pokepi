# Pokepi audio: MAX98357A I2S amp. The amp has no volume control of its own, so
# "Master" is a software volume. dmix lets more than one program play at once.
pcm.speaker_hw {
    type hw
    card MAX98357A
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "speaker_hw"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Master"
        card MAX98357A
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card MAX98357A
}
